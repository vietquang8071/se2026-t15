[project]
name = "meeting-minutes-llm-service"
version = "0.1.0"
description = "HTTP runtime and contract models for the Meeting Minutes Assistant LLM Service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx2>=2,<3",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.uv]
package = false
