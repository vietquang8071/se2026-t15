[project]
name = "meeting-minutes-llm-service"
version = "0.1.0"
description = "Contract models and fixtures for the Meeting Minutes Assistant LLM Service."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.uv]
package = false
